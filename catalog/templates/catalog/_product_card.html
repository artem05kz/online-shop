{% load static %}
<div class="product-card">
    <a href="{{ product.get_absolute_url }}">
        {% with image=product.primary_image %}
            {% if image %}
                <img src="{{ image.image.url }}" alt="{{ product.name }}">
            {% else %}
                <img src="{% static 'img/no-photo.svg' %}" alt="{{ product.name }}">
            {% endif %}
        {% endwith %}
    </a>
    <div class="name"><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></div>
    {% if product.min_price %}
        <div class="price">от {{ product.min_price|floatformat:0 }} ₸</div>
    {% else %}
        <div class="price stock-out">цена уточняется</div>
    {% endif %}
    <a class="btn" href="{{ product.get_absolute_url }}">Смотреть</a>
</div>
