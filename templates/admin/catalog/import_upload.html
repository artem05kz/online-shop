{% extends "admin/base_site.html" %}

{% block content %}
<h1>Загрузка товаров из 1С</h1>
<p>Выберите один или оба файла, которые вы выгрузили из 1С. На следующем шаге можно будет посмотреть,
   что получилось, и снять галочки с ненужных строк — в базу пока ничего не запишется.</p>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <fieldset class="module aligned">
        <div class="form-row">
            <div>
                <label for="id_price_list">Прайс-лист (название, фото, описание, цена):</label>
                <input type="file" name="price_list" id="id_price_list" accept=".xlsx">
            </div>
        </div>
        <div class="form-row">
            <div>
                <label for="id_stock">Остатки (артикул, количество на складе):</label>
                <input type="file" name="stock" id="id_stock" accept=".xlsx">
            </div>
        </div>
    </fieldset>
    <div class="submit-row">
        <input type="submit" value="Посмотреть, что получится" class="default">
    </div>
</form>
{% endblock %}
